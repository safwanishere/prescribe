<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — Prescribe</title>
  <meta name="description" content="Log in to your Prescribe account.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/login.css">
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a href="index.html" class="brand">Prescribe</a>
      <div class="cluster">
        <span class="auth-nav__prompt">New to Prescribe?</span>
        <a href="signup.html" class="btn btn--primary">Sign up</a>
      </div>
    </div>
  </header>

  <main class="auth-page">
    <section class="auth-card" aria-labelledby="auth-title">
      <div class="auth-card__intro">
        <span class="auth-eyebrow">Welcome back</span>
        <h1 id="auth-title">Log in to Prescribe</h1>
        <p class="muted">Pick up where you left off with your clinical notes.</p>
      </div>

      <form class="auth-form" action="#" method="post">
        <div class="auth-field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </div>
        <div class="auth-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
        </div>
        <button class="btn btn--primary btn--lg auth-submit" type="submit">Log in</button>
      </form>

      <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
    </section>
  </main>
</body>
</html>
