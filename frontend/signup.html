<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up — Prescribe</title>
  <meta name="description" content="Create your Prescribe account.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/login.css">
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a href="index.html" class="brand">Prescribe</a>
      <div class="cluster">
        <span class="auth-nav__prompt">Already have an account?</span>
        <a href="login.html" class="btn btn--ghost">Log in</a>
      </div>
    </div>
  </header>

  <main class="auth-page">
    <section class="auth-card" aria-labelledby="auth-title">
      <div class="auth-card__intro">
        <span class="auth-eyebrow">Get started</span>
        <h1 id="auth-title">Create your account</h1>
        <p class="muted">Make your clinical notes easier to search and review.</p>
      </div>

      <form id="signup-form" class="auth-form">
        <div class="auth-field">
          <label for="email">Email address <span class="red-txt">*</span></label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </div>
        <div class="auth-field">
          <label for="password">Password <span class="red-txt">*</span></label>
          <input id="password" name="password" type="password" autocomplete="new-password" placeholder="Create a password" required>
        </div>
        <div class="auth-field">
          <label for="name" >Name <span class="red-txt">*</span></label>
          <input id="name" name="name" type="text" placeholder="Enter your name" required>
        </div>
        <button class="btn btn--primary btn--lg auth-submit" type="submit">Create account</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    </section>
  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
